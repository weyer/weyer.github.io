<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tamori</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Pixelify+Sans:wght@500;700&display=swap"
    />
    <script type="module" crossorigin src="./assets/index-itxEQyiI.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B8wC95W0.css">
  </head>
  <body>
    <!-- All visible texts come from the translation files in src/i18n. -->
    <main id="app">
      <section class="view menu" id="view-menu">
        <div class="menu-card">
          <canvas id="menu-art" width="64" height="40" aria-hidden="true"></canvas>
          <h1 class="logo">Tamori</h1>
          <p class="lede" data-i18n="start.tagline"></p>
          <div class="menu-buttons">
            <button type="button" class="primary" id="m-continue" data-i18n="start.continue" hidden></button>
            <button type="button" id="m-new" data-i18n="start.new"></button>
            <button type="button" id="m-load" data-i18n="start.load"></button>
            <button type="button" id="m-labor" data-i18n="start.labor"></button>
          </div>
          <p class="hint" id="m-info"></p>
          <div id="m-lang"></div>
          <p class="version" id="m-version"></p>
        </div>
      </section>

      <section class="view game" id="view-game" hidden>
        <header class="hud">
          <div class="who">
            <p class="eyebrow" id="g-stage"></p>
            <p class="name"><span id="g-name"></span> <span class="title-small" id="g-title"></span></p>
          </div>
          <div class="when">
            <p class="clock" id="g-clock"></p>
            <p class="season" id="g-season"></p>
          </div>
        </header>

        <div class="world-wrap">
          <canvas id="world" data-i18n-aria-label="game.world"></canvas>
          <div class="ring" id="ring" hidden></div>
        </div>

        <!-- Progress panels from src/config/processes.ts -->
        <div class="processes" id="processes"></div>
        <div class="needs" id="needs"></div>
        <p class="activity"><span id="g-activity"></span></p>
        <p class="message" id="g-message" role="status"></p>

        <!-- Buttons from src/config/actions.ts -->
        <nav class="actions" id="actions" data-i18n-aria-label="game.actions"></nav>
      </section>

      <section class="view lab" id="view-labor" hidden>
        <header class="masthead">
          <div class="lab-nav">
            <button type="button" id="lab-back" data-i18n="lab.back"></button>
            <button type="button" class="primary" id="lab-adopt" data-i18n="lab.adopt"></button>
          </div>
          <p class="status" id="lab-adopt-status" role="status"></p>
          <p class="eyebrow" data-i18n="lab.eyebrow"></p>
          <h1 data-i18n="lab.title"></h1>
          <p class="lede" data-i18n="lab.lede"></p>
        </header>

        <div class="workbench">
          <aside class="preview" data-i18n-aria-label="lab.preview">
            <canvas id="big" width="32" height="32" data-i18n-aria-label="lab.current"></canvas>
            <div class="identity">
              <p class="eyebrow" id="detail-type"></p>
              <p class="title" id="detail-title"></p>
              <p class="seed">
                <span data-i18n="lab.eggNumberShort"></span> <span id="detail-seed"></span>
                <span class="badge" id="seed-changed" data-i18n="lab.changed" hidden></span>
              </p>
            </div>
            <div class="stages" role="group" data-i18n-aria-label="lab.stage" id="stages"></div>
            <div class="anim-bar">
              <div class="anims" role="group" data-i18n-aria-label="lab.animation" id="anims"></div>
              <button type="button" id="pause" aria-pressed="false"></button>
            </div>
          </aside>

          <div class="editor">
            <details class="group" open>
              <summary data-i18n="lab.character"></summary>
              <p class="hint" data-i18n="lab.characterHint"></p>
              <div class="sliders" id="axes"></div>
              <button type="button" id="reset" data-i18n="lab.reset"></button>
            </details>

            <details class="group" open>
              <summary data-i18n="lab.headFace"></summary>
              <div class="genes" data-genes="head ears snout eyes"></div>
            </details>

            <details class="group" open>
              <summary data-i18n="lab.body"></summary>
              <div class="genes" data-genes="body legs feet tail"></div>
            </details>

            <details class="group" open>
              <summary data-i18n="lab.skinColors"></summary>
              <div class="genes" data-genes="skin pattern"></div>
              <div class="sliders" id="colors"></div>
              <div class="genes" data-genes="secondary patternColor"></div>
            </details>

            <details class="group" open>
              <summary data-i18n="lab.sizeTastes"></summary>
              <div class="sliders" id="size"></div>
              <div class="genes" data-genes="favoriteTaste hatedTaste"></div>
            </details>

            <details class="group" open>
              <summary data-i18n="lab.geneCode"></summary>
              <p class="hint" data-i18n="lab.geneCodeHint"></p>
              <div class="code-row">
                <code class="gene-code" id="gene-code"></code>
                <button type="button" id="copy-code" data-i18n="lab.copy"></button>
              </div>
              <form class="seed-form" id="code-form">
                <label for="code-input" data-i18n="lab.loadCode"></label>
                <input
                  id="code-input"
                  type="text"
                  autocomplete="off"
                  autocapitalize="characters"
                  spellcheck="false"
                  data-i18n-placeholder="lab.codePlaceholder"
                />
                <button type="submit" data-i18n="lab.load"></button>
              </form>
              <p class="status" id="code-status" role="status"></p>
            </details>

            <details class="group">
              <summary data-i18n="lab.eggNumber"></summary>
              <p class="hint" data-i18n="lab.eggNumberHint"></p>
              <form class="seed-form" id="seed-form">
                <label for="seed-input" data-i18n="lab.eggNumberShort"></label>
                <input id="seed-input" type="number" min="0" max="4294967295" inputmode="numeric" />
                <button type="submit" data-i18n="lab.load"></button>
                <button type="button" id="random-seed" data-i18n="lab.randomEgg"></button>
              </form>
            </details>
          </div>
        </div>

        <section class="nest" aria-labelledby="nest-title">
          <div class="nest-head">
            <div>
              <h2 id="nest-title" data-i18n="lab.clutch"></h2>
              <p class="hint" data-i18n="lab.clutchHint"></p>
            </div>
            <button type="button" class="primary" id="reroll" data-i18n="lab.newEggs"></button>
          </div>
          <div class="nest-grid" id="nest"></div>
        </section>
      </section>
    </main>

    <div class="sheet-backdrop" id="sheet" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
          <h2 id="sheet-title"></h2>
          <button type="button" class="close" id="sheet-close" data-i18n-aria-label="dialog.close">×</button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>
  </body>
</html>
